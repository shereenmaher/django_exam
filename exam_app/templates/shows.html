<!DOCTYPE html>
<html>
<head>
    <title>Shows</title>
</head>

<body>

    

    <h2>Welcome to your NEXTFIX, {{user.firstname}}</h2>

     <a href="shows/new">
        + Create 
    </a>

    <a href="/logout">Logout</a>

    <h2>All TV Shows:</h2>


   


    <table border="1">

        <thead>

            <tr>
                <th>Title</th>
                <th>Network</th>
                <th>Realeased Date</th>
                <th>More</th>
            </tr>

        </thead>


        <tbody>

            {% for show in Shows %}

                <tr>

                    <td>
                        <a href="shows/{{ show.id }}">
                            {{ show.title }}
                        </a>
                    </td>

                    <td>
                        {{ show.network }}
                    </td>

                    <td>
                        {{ show.released_date }}
                    </td>

                        {% if show.user.id == user.id %}

                            <a href="shows/delete/{{ show.id }}">
                                Delete
                            </a>

                            <a href="shows/edit/{{ show.id }}">
                                Edit
                            </a>
                        {%  else   %}
                            <a href="shows/{{ show.id }}">
                                Details
                            </a>

                        {% endif %}
                        

                    </td>

                </tr>

            {% endfor %}

        </tbody>

    </table>

</body>
</html>
